[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzy-nemo-guardrails"
version = "0.1.1"
description = "Configurable fuzzy decision layer for NVIDIA NeMo LLMRails and IORails"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Fuzzy NeMo Contributors"}]
dependencies = ["PyYAML>=6.0,<7"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: Apache Software License"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
demo = ["gradio>=4.0"]
nemo = ["nemoguardrails>=0.25,<0.27"]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "fastapi>=0.110"]

[project.scripts]
fuzzy-nemo = "fuzzy_nemo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.package-data]
fuzzy_nemo = ["*.yaml"]
