<text x="898" y="289" fill="#102c36" font-size="19" font-weight="700" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">checked response</text>
<text x="898" y="370" fill="#d75d48" font-size="14" font-weight="800" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">WITHHOLD</text>
<text x="898" y="398" fill="#102c36" font-size="19" font-weight="700" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">fixed fallback</text>
<path d="M843 295L871 279" stroke="#008c83" stroke-width="3" stroke-linecap="round"/>
<path d="M864.7 289.2L871 279L859.0 279.2" fill="none" stroke="#008c83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M843 357L871 373" stroke="#d75d48" stroke-width="3" stroke-linecap="round"/>
<path d="M859.0 372.8L871 373L864.7 362.8" fill="none" stroke="#d75d48" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="52" y="556" width="1048" height="48" rx="13" fill="#e7f2ee" stroke="none" stroke-width="1.4"/>
<text x="70" y="577" fill="#102c36" font-size="15" font-weight="600" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">On each turn: inspect the actual draft before any text or tool side effect is released.</text>
</svg>
