<path d="M309.5 331.8L320 326L309.5 320.2" fill="none" stroke="#008c83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M569 326L595 326" stroke="#008c83" stroke-width="3" stroke-linecap="round"/>
<path d="M584.5 331.8L595 326L584.5 320.2" fill="none" stroke="#008c83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="878" y="226" width="223" height="90" rx="22" fill="#cdeee5" stroke="none" stroke-width="1.4"/>
<rect x="878" y="335" width="223" height="90" rx="22" fill="#ffe4d8" stroke="none" stroke-width="1.4"/>
