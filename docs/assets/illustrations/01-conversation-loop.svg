<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="664" viewBox="0 0 1152 664" role="img" aria-labelledby="title desc">
<title id='title'>The conversation becomes a controlled loop</title><desc id='desc'>A user message is encoded as evidence, updates the session belief, and reaches a constrained gate. Allowed drafts are released; other drafts receive fixed fallback text. The loop repeats per turn.</desc>
<rect width="1152" height="664" rx="30" fill="#f5f5f0"/>
<path d="M0 182H1152" stroke="#d8e3df"/>
<rect x="36" y="29" width="66" height="28" rx="14" fill="#d9efe8"/>
<text x="69" y="48" fill="#008c83" font-size="15" font-weight="800" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif">01</text>
<text x="120" y="50" fill="#527079" font-size="15" font-weight="700" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">CSFSM  /  VISUAL FIELD GUIDE</text>
<text x="52" y="109" fill="#102c36" font-size="36" font-weight="800" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">The conversation becomes a controlled loop</text>
<text x="52" y="145" fill="#527079" font-size="18" font-weight="500" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">A guardrail decides whether content or a tool call may cross the application boundary.</text>
<path d="M36 614H1116" stroke="#d8e3df"/>
<text x="52" y="643" fill="#527079" font-size="12" font-weight="700" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">CSFSM GUARDRAILS  ·  ANGSHUL MAJUMDAR  ·  IIIT-DELHI</text>
<text x="1102" y="643" fill="#527079" font-size="11" font-weight="500" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif">FIGURE 01 / 08</text>
<rect x="52" y="226" width="240" height="199" rx="23" fill="#d9eaff" stroke="none" stroke-width="1.4"/>
<text x="72" y="266" fill="#527079" font-size="14" font-weight="800" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">01  MESSAGE</text>
<text x="72" y="320" fill="#102c36" font-size="23" font-weight="750" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Untrusted input</text>
<text x="72" y="359" fill="#527079" font-size="15" font-weight="500" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">checked before generation</text>
<rect x="327" y="226" width="240" height="199" rx="23" fill="#cdeee5" stroke="none" stroke-width="1.4"/>
<text x="347" y="266" fill="#527079" font-size="14" font-weight="800" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">02  FILTER</text>
<text x="347" y="320" fill="#102c36" font-size="23" font-weight="750" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Posterior belief b</text>
<text x="347" y="359" fill="#527079" font-size="15" font-weight="500" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">mode probabilities updated</text>
<rect x="602" y="226" width="240" height="199" rx="23" fill="#fff0ce" stroke="none" stroke-width="1.4"/>
<text x="622" y="266" fill="#527079" font-size="14" font-weight="800" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">03  GATE</text>
<text x="622" y="320" fill="#102c36" font-size="23" font-weight="750" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Admissible actions</text>
<text x="622" y="359" fill="#527079" font-size="15" font-weight="500" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">protocol + risk + validators</text>
