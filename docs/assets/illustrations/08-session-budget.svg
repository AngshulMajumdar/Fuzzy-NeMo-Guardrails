<text x="576" y="268" fill="#ffffff" font-size="24" font-weight="700" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif">alpha = 0.05       H = 10       allowance &lt;= alpha / H = 0.005</text>
