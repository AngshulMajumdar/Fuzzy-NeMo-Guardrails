<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="664" viewBox="0 0 1152 664" role="img" aria-labelledby="title desc">
<title id='title'>An optional bound applies across the whole session</title><desc id='desc'>If alpha equals 0.05 and at most H equals 10 decisions are made, each conditional risk allowance is at most 0.005, yielding a union bound of 0.05 on any violation under the stated assumptions. The default mode uses model scores, not this guarantee.</desc>
<rect width="1152" height="664" rx="30" fill="#f5f5f0"/>
<path d="M0 182H1152" stroke="#d8e3df"/>
<rect x="36" y="29" width="66" height="28" rx="14" fill="#d9efe8"/>
<text x="69" y="48" fill="#008c83" font-size="15" font-weight="800" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif">08</text>
<text x="120" y="50" fill="#527079" font-size="15" font-weight="700" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">CSFSM  /  VISUAL FIELD GUIDE</text>
<text x="52" y="109" fill="#102c36" font-size="36" font-weight="800" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">An optional bound applies across the whole session</text>
<text x="52" y="145" fill="#527079" font-size="18" font-weight="500" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Use this only when a deployment can justify conditional violation bounds.</text>
<path d="M36 614H1116" stroke="#d8e3df"/>
<text x="52" y="643" fill="#527079" font-size="12" font-weight="700" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">CSFSM GUARDRAILS  ·  ANGSHUL MAJUMDAR  ·  IIIT-DELHI</text>
<text x="1102" y="643" fill="#527079" font-size="11" font-weight="500" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif">FIGURE 08 / 08</text>
