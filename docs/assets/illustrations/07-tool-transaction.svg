<text x="76" y="481" fill="#102c36" font-size="18" font-weight="700" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">REPLAY: return authorized cached result</text>
<text x="76" y="508" fill="#527079" font-size="15" font-weight="500" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Never silently invoke a completed tool again.</text>
<text x="592" y="481" fill="#102c36" font-size="18" font-weight="700" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">CRASH: pending execution remains pending</text>
<text x="592" y="508" fill="#527079" font-size="15" font-weight="500" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Host reconciles unknown external side effects.</text>
<rect x="52" y="556" width="1048" height="48" rx="13" fill="#e7f2ee" stroke="none" stroke-width="1.4"/>
<text x="70" y="577" fill="#102c36" font-size="15" font-weight="600" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Tool results are checked before disclosure; a blocked result cannot undo a tool&#x27;s side effects.</text>
