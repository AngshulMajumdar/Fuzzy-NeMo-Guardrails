<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="664" viewBox="0 0 1152 664" role="img" aria-labelledby="title desc">
<title id='title'>A protected tool needs more than a text check</title><desc id='desc'>Host verification plus an exact argument-bound grant allow a tool request. The runtime reserves an execution ID, rechecks permission, invokes the tool, inspects its result, then releases or withholds. Replays do not reinvoke.</desc>
<rect width="1152" height="664" rx="30" fill="#f5f5f0"/>
<path d="M0 182H1152" stroke="#d8e3df"/>
<rect x="36" y="29" width="66" height="28" rx="14" fill="#d9efe8"/>
<text x="69" y="48" fill="#008c83" font-size="15" font-weight="800" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif">07</text>
<text x="120" y="50" fill="#527079" font-size="15" font-weight="700" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">CSFSM  /  VISUAL FIELD GUIDE</text>
<text x="52" y="109" fill="#102c36" font-size="36" font-weight="800" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">A protected tool needs more than a text check</text>
<text x="52" y="145" fill="#527079" font-size="18" font-weight="500" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">The host registers the function, verifies the user, and grants one exact call.</text>
<path d="M36 614H1116" stroke="#d8e3df"/>
<text x="52" y="643" fill="#527079" font-size="12" font-weight="700" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">CSFSM GUARDRAILS  ·  ANGSHUL MAJUMDAR  ·  IIIT-DELHI</text>
<text x="1102" y="643" fill="#527079" font-size="11" font-weight="500" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif">FIGURE 07 / 08</text>
