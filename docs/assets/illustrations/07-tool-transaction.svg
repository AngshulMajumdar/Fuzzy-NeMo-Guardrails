<text x="68" y="286" fill="#527079" font-size="14" font-weight="800" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">HOST EVENT</text>
<text x="68" y="334" fill="#102c36" font-size="19" font-weight="750" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">verify user</text>
<circle cx="79" cy="383" r="10" fill="#008c83" stroke="none" stroke-width="2"/>
