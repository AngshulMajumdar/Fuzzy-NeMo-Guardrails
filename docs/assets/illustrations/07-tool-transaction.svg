<text x="283" y="334" fill="#102c36" font-size="19" font-weight="750" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">bind exact args</text>
<circle cx="294" cy="383" r="10" fill="#008c83" stroke="none" stroke-width="2"/>
