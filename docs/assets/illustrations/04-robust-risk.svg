<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="664" viewBox="0 0 1152 664" role="img" aria-labelledby="title desc">
<title id='title'>Risk is evaluated under belief uncertainty</title><desc id='desc'>The robust bound is the smaller of maximum state risk and nominal risk plus TV radius times range. Example below uses nominal 0.10 and TV 0.05 to yield bound 0.15 under threshold 0.20, while nominal 0.57 yields bound 0.62 and blocks.</desc>
<rect width="1152" height="664" rx="30" fill="#f5f5f0"/>
<path d="M0 182H1152" stroke="#d8e3df"/>
<rect x="36" y="29" width="66" height="28" rx="14" fill="#d9efe8"/>
<text x="69" y="48" fill="#008c83" font-size="15" font-weight="800" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif">04</text>
<text x="120" y="50" fill="#527079" font-size="15" font-weight="700" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">CSFSM  /  VISUAL FIELD GUIDE</text>
<text x="52" y="109" fill="#102c36" font-size="36" font-weight="800" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Risk is evaluated under belief uncertainty</text>
<text x="52" y="145" fill="#527079" font-size="18" font-weight="500" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">The default policy uses model scores; probability guarantees need a justified risk model.</text>
<path d="M36 614H1116" stroke="#d8e3df"/>
<text x="52" y="643" fill="#527079" font-size="12" font-weight="700" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">CSFSM GUARDRAILS  ·  ANGSHUL MAJUMDAR  ·  IIIT-DELHI</text>
<text x="1102" y="643" fill="#527079" font-size="11" font-weight="500" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif">FIGURE 04 / 08</text>
<rect x="52" y="210" width="1048" height="86" rx="22" fill="#102c36" stroke="none" stroke-width="1.4"/>
<text x="576" y="264" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif">risk_upper(a) = min[ max(R[:,a]), bR[:,a] + eta * range(R[:,a]) ]</text>
<rect x="52" y="320" width="495" height="212" rx="22" fill="#cdeee5" stroke="none" stroke-width="1.4"/>
<rect x="568" y="320" width="532" height="212" rx="22" fill="#ffe4d8" stroke="none" stroke-width="1.4"/>
<text x="75" y="356" fill="#008c83" font-size="15" font-weight="800" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">LOW-RISK BELIEF</text>
<text x="592" y="356" fill="#d75d48" font-size="15" font-weight="800" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">HIGH-RISK BELIEF</text>
<text x="75" y="401" fill="#102c36" font-size="21" font-weight="700" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">nominal 0.10  +  radius 0.05</text>
<text x="592" y="401" fill="#102c36" font-size="21" font-weight="700" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">nominal 0.57  +  radius 0.05</text>
<text x="75" y="445" fill="#008c83" font-size="20" font-weight="750" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">upper bound 0.15 &lt;= limit 0.20</text>
<text x="592" y="445" fill="#d75d48" font-size="20" font-weight="750" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">upper bound 0.62 &gt; limit 0.20</text>
<rect x="75" y="467" width="140" height="34" rx="17" fill="#ffffff" stroke="none" stroke-width="1.4"/>
<text x="145.0" y="490" fill="#008c83" font-size="14" font-weight="750" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif">may allow</text>
<rect x="592" y="467" width="140" height="34" rx="17" fill="#ffffff" stroke="none" stroke-width="1.4"/>
<text x="662.0" y="490" fill="#d75d48" font-size="14" font-weight="750" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif">block action</text>
<rect x="52" y="556" width="1048" height="48" rx="13" fill="#e7f2ee" stroke="none" stroke-width="1.4"/>
<text x="70" y="577" fill="#102c36" font-size="15" font-weight="600" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">eta is a total-variation radius; this bound is conservative, not always the exact worst case.</text>
</svg>
