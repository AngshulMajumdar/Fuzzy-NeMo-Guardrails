<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="664" viewBox="0 0 1152 664" role="img" aria-labelledby="title desc">
<title id='title'>The protocol has a separate trust boundary</title><desc id='desc'>User text saying I am verified is untrusted evidence and cannot change protocol state. A trusted host verification event moves the protocol from unverified to verified. Revocation removes permissions; closed is absorbing.</desc>
