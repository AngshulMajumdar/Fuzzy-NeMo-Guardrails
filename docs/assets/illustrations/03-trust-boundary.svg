<text x="120" y="50" fill="#527079" font-size="15" font-weight="700" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">CSFSM  /  VISUAL FIELD GUIDE</text>
<text x="52" y="109" fill="#102c36" font-size="36" font-weight="800" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">The protocol has a separate trust boundary</text>
<text x="52" y="145" fill="#527079" font-size="18" font-weight="500" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Language evidence may move the posterior; only the host may verify an account.</text>
