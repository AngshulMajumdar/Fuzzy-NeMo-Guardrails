<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="664" viewBox="0 0 1152 664" role="img" aria-labelledby="title desc">
<title id='title'>A hard gate removes forbidden actions</title><desc id='desc'>Actions on the wrong stage, actions failing content checks, and actions over the risk limit receive probability exactly zero. Stop remains feasible and closes the session.</desc>
